x-servicio: &servicio
  networks: [privada]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health-interno')"]
    interval: 10s
    timeout: 5s
    retries: 5

x-db: &db
  image: postgres:16-alpine
  networks: [privada]
  restart: unless-stopped

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [kong]
    networks: [publica, privada]

  kong:
    image: kong:3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    depends_on: [usuarios, productos, pedidos]
    networks: [privada]

  usuarios:
    <<: *servicio
    build: ./usuarios
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db-usuarios/usuarios
    depends_on:
      db-usuarios: {condition: service_healthy}

  db-usuarios:
    <<: *db
    environment: {POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: usuarios}
    volumes: [datos-usuarios:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d usuarios"], interval: 5s, timeout: 5s, retries: 10}

  productos:
    <<: *servicio
    build: ./productos
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db-productos/productos
    depends_on:
      db-productos: {condition: service_healthy}

  db-productos:
    <<: *db
    environment: {POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: productos}
    volumes: [datos-productos:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d productos"], interval: 5s, timeout: 5s, retries: 10}

  pedidos:
    <<: *servicio
    build: ./pedidos
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db-pedidos/pedidos
    depends_on:
      db-pedidos: {condition: service_healthy}

  db-pedidos:
    <<: *db
    environment: {POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: pedidos}
    volumes: [datos-pedidos:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d pedidos"], interval: 5s, timeout: 5s, retries: 10}

volumes:
  datos-usuarios:
  datos-productos:
  datos-pedidos:

networks:
  publica:
  privada:
    internal: true